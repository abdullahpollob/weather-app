<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" alt="umbrella" />
      <h1>Weather App</h1>
      <h4>Submitted By: Abdullah</h4>
      <h4>Submitted To: Abdullah Al Mamun</h4>

    </div><br>

    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name (e.g., Gazipur)">
      <button id="searchBtn">Search</button>
    </div>

    <div class="weather-card hidden" id="weatherCard">
      <h2 id="cityName">--</h2>
      <p id="condition">--</p>
      <h1 id="temp">--°C</h1>

      <div class="details">
        <div class="box"><span id="humidity">--%</span>
          <p>Humidity</p>
        </div>
        <div class="box"><span id="wind">-- km/h</span>
          <p>Wind</p>
        </div>
        <div class="box"><span id="uv">--</span>
          <p>UV Index</p>
        </div>
        <div class="box"><span id="visibility">-- km</span>
          <p>Visibility</p>
        </div>
      </div>
    </div>
  </div>

  <script src="scripet.js"></script>
</body>

</html>
